# Reads VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY from a local .env file
# (see .env.example). Because Vite bakes these into the JS bundle at build
# time, they're passed as build args, not runtime environment variables.

services:
  # Production: static build served by nginx -> http://localhost:8080
  web:
    build:
      context: .
      target: production
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev: Vite dev server with hot reload -> http://localhost:4028
  # Run with: docker compose --profile dev up web-dev
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "4028:4028"
    volumes:
      - .:/app
      - /app/node_modules
